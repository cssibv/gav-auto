body.qp{background:#fff}

.qa{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none;transition:border-color .15s ease,background .15s ease}
.qa:hover{border-color:#c7d3e6;background:#fafcff}
.qa:active{background:#f4f7fc}
.qa .ic{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.qa .ic svg{width:21px;height:21px}
.qa .txt{flex:1;display:flex;flex-direction:column;line-height:1.25;font-weight:700;font-size:1.04rem}
.qa .txt small{font-weight:500;font-size:0.86rem;color:var(--ink-2);margin-top:2px}
.qa .go{width:18px;height:18px;flex:0 0 18px;color:#a3b0c4}
.ic.blue{background:var(--brand-soft);color:var(--brand)}
.ic.green{background:#e7f8ee;color:#1faa53}
.ic.amber{background:#fff4e0;color:#f5a623}
.ic.cyan{background:#e3f8ff}
.qp-foot{text-align:center;margin-top:30px;font-size:0.88rem;color:var(--ink-2);display:grid;gap:8px}
.qp-foot .site{font-weight:600;color:var(--brand);text-decoration:none}
.qp-foot .legal-links{justify-content:center;font-size:0.8rem}
</style>
